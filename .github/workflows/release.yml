# SPDX-License-Identifier: GPL-3.0-or-later
# Push a tag like v0.5.0 (matching screend/__init__.py) to publish a release with the .deb attached.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the app version
        run: |
          version=$(python3 -c "import re; print(re.search(r'\"(.+)\"', open('screend/__init__.py').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: Build the Debian package
        run: packaging/build-deb.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --title "Screend $GITHUB_REF_NAME" --generate-notes
